name: IPv4 TCP UDP foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Protocol parser tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all kernel/network/ip_transport.c tests/ip_transport_test.c -o /tmp/aion-ip-test
          /tmp/aion-ip-test
      - name: Freestanding cross-architecture compilation
        run: |
          for target in x86_64-none-elf aarch64-none-elf; do
            clang --target="$target" -ffreestanding -Wall -Wextra -Werror -c kernel/network/ip_transport.c -o /tmp/aion-ip-"$target".o
          done
