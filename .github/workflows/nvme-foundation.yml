name: NVMe foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  nvme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: NVMe identify parsing tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all kernel/hardware/nvme.c tests/nvme_test.c -o /tmp/aion-nvme-test
          /tmp/aion-nvme-test
      - name: Freestanding cross-architecture compile
        run: |
          for target in x86_64-none-elf aarch64-none-elf; do
            clang --target="$target" -ffreestanding -Wall -Wextra -Werror -c kernel/hardware/nvme.c -o /tmp/aion-nvme-"$target".o
          done
