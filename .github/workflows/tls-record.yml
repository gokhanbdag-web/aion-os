name: TLS record foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tls-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: TLS record framing tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all kernel/network/tls_record.c tests/tls_record_test.c -o /tmp/aion-tls-test
          /tmp/aion-tls-test
      - name: Freestanding x86-64 and ARM64 compile
        run: |
          for target in x86_64-none-elf aarch64-none-elf; do
            clang --target="$target" -ffreestanding -Wall -Wextra -Werror -c kernel/network/tls_record.c -o /tmp/aion-tls-"$target".o
          done
