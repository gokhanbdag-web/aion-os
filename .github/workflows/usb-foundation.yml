name: USB foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  usb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: USB descriptor parsing tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all kernel/hardware/usb.c tests/usb_test.c -o /tmp/aion-usb-test
          /tmp/aion-usb-test
      - name: Freestanding cross-architecture compile
        run: |
          for target in x86_64-none-elf aarch64-none-elf; do
            clang --target="$target" -ffreestanding -Wall -Wextra -Werror -c kernel/hardware/usb.c -o /tmp/aion-usb-"$target".o
          done
