name: SMP CPU registry
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  smp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CPU lifecycle tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all kernel/arch/smp.c tests/smp_test.c -o /tmp/aion-smp-test
          /tmp/aion-smp-test
      - name: Cross-architecture freestanding compile
        run: |
          clang --target=x86_64-none-elf -ffreestanding -Wall -Wextra -Werror -c kernel/arch/smp.c -o /tmp/smp-x86.o
          clang --target=aarch64-none-elf -ffreestanding -Wall -Wextra -Werror -c kernel/arch/smp.c -o /tmp/smp-arm.o
