name: Block device abstraction
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  block:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host block device tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all kernel/storage/block.c tests/block_test.c -o /tmp/aion-block-test
          /tmp/aion-block-test
      - name: Freestanding cross-build
        run: |
          for target in x86_64-none-elf aarch64-none-elf; do
            clang --target="$target" -ffreestanding -Wall -Wextra -Werror -c kernel/storage/block.c -o /tmp/aion-block-"$target".o
          done
