name: ACPI discovery
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  acpi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ACPI table parsing and corruption tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all kernel/hardware/acpi.c tests/acpi_test.c -o /tmp/aion-acpi-test
          /tmp/aion-acpi-test
      - name: Freestanding cross-architecture compile
        run: |
          for target in x86_64-none-elf aarch64-none-elf; do
            clang --target="$target" -ffreestanding -Wall -Wextra -Werror -c kernel/hardware/acpi.c -o /tmp/aion-acpi-"$target".o
          done
