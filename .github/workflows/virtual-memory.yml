name: Virtual memory mapping
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  vmm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host mapping tests with undefined behavior sanitizer
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all kernel/memory/virtual.c tests/vmm_test.c -o /tmp/aion-vmm-test
          /tmp/aion-vmm-test
      - name: Freestanding cross-architecture compile
        run: |
          clang --target=x86_64-none-elf -ffreestanding -Wall -Wextra -Werror -c kernel/memory/virtual.c -o /tmp/vmm-x86.o
          clang --target=aarch64-none-elf -ffreestanding -Wall -Wextra -Werror -c kernel/memory/virtual.c -o /tmp/vmm-arm.o
