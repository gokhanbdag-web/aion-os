name: System call dispatch
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  syscall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run syscall tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all kernel/security/privilege.c kernel/syscall/syscall.c tests/syscall_test.c -o /tmp/aion-syscall-test
          /tmp/aion-syscall-test
      - name: Freestanding x86-64 and ARM64 compile
        run: |
          for target in x86_64-none-elf aarch64-none-elf; do
            clang --target="$target" -ffreestanding -Wall -Wextra -Werror -c kernel/syscall/syscall.c -o /tmp/syscall-"$target".o
          done
