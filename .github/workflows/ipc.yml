name: IPC mailboxes
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  ipc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: IPC host tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all kernel/security/privilege.c kernel/ipc/ipc.c tests/ipc_test.c -o /tmp/aion-ipc-test
          /tmp/aion-ipc-test
      - name: Freestanding architecture builds
        run: |
          for target in x86_64-none-elf aarch64-none-elf; do
            clang --target="$target" -ffreestanding -Wall -Wextra -Werror -c kernel/ipc/ipc.c -o /tmp/ipc-"$target".o
          done
